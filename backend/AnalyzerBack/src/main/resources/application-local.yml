server:
  port: 5555
  servlet:
    context-path: /
  tomcat:
    max-connections: 10000
    accept-count: 200
    threads:
      max: 300
      min-spare: 10
  max-http-request-header-size: 500KB

# spring配置
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # 数据库mysql
  datasource:
    url: jdbc:mysql://localhost:3306/resume_data
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# DeepSeek 客户端配置（API 地址、超时、模型名）
deepseek:
  client:
    api-url: https://api.deepseek.com/v1/chat/completions
    connect-timeout: 30   # 连接超时（秒）
    read-timeout: 120     # 读取超时（秒）
    write-timeout: 30     # 写入超时（秒）
    call-timeout: 180     # 单次请求总超时（秒）
    retry: 3              # 最大重试次数（不含首次请求）
    retry-backoff-ms: 1000
    retry-max-backoff-ms: 8000
    model:
      chat: deepseek-chat
      reasoner: deepseek-reasoner   # useSiliconFlow 时使用
  extract:
    batch:
      max-size: 20
    llm:
      executor-threads: 8
      queue-capacity: 200
  analyze:
    batch:
      max-size: 20
    llm:
      executor-threads: 5
      queue-capacity: 200
  filter:
    llm:
      executor-threads: 8
      queue-capacity: 200

# java端传向的FastAPI端口
python:
  fastapi:
    base-url: http://127.0.0.1:8000

# 默认的传给FastAPI筛选数量设置
python-task:
  top-k: 20
  recall-k: 200

# 上传的zip文件的配置（压缩的是简历）
zip:
  resume:
    max-files: 500
    max-single-file-bytes: 20971520   # 20MB
    buffer-size: 8192
